# Git hooks. Installed by `bun install` (the root `prepare` script).
commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-commit:
  commands:
    biome:
      glob: "*.{js,mjs,cjs,ts,json,jsonc,astro,css}"
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
