name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only pull requests share a group. A deploy waiting for approval keeps its run open, so a shared group on main
# would hold back the CI of every later push.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  LEFTHOOK: "0"
  SITE_URL: http://localhost:8787
  SITE_INDEXABLE: "false"
  WRANGLER_SEND_METRICS: "false"

jobs:
  quality:
    name: Lint, types, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: bunx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      - name: Validate latest commit message
        if: github.event_name == 'push'
        run: bunx commitlint --last --verbose
      - run: bun run check
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: apps/web/dist
          include-hidden-files: true
          retention-days: 7

  e2e:
    name: Playwright
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium webkit
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

  lighthouse:
    name: Lighthouse budgets
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: apps/web/dist
      - run: bun run lhci
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: apps/web/.lighthouseci
          include-hidden-files: true
          retention-days: 14

  deploy:
    name: Deploy to Cloudflare
    needs: [e2e, lighthouse]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Check production settings
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Set the SITE_URL variable in the GitHub 'production' environment."
            exit 1
          fi
      - name: Build with production settings
        run: bun run build
      - name: Audit the build for indexing
        run: bun run check:seo-build
      - name: Deploy Worker static assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          workingDirectory: apps/web
          command: deploy
      - name: Install Playwright browsers
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium webkit
      - name: Smoke-test the deployment
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.SITE_URL }}
        run: bun run test:e2e:deployed
